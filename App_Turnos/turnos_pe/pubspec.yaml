name: turnos_pe
description: "Turco - Gestion de turnos de una peluqueria. Primer Examen Parcial."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^16.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagenes/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fuentes/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Poppins-Bold.ttf
          weight: 700
